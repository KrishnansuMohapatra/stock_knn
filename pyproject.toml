[project]
name = "stock-knn"
version = "0.2.0"
description = "Educational stock dashboard with causal ML forecasts and a simulated paper broker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=6.0",
    "scikit-learn>=1.5",
    "streamlit>=1.40",
    "requests>=2.32",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
